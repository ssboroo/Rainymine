name: Windows desktop build
on:
  push:
    branches: [main, codex/rainymine-0.9]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RAINYMINE_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify merge resolution with Git CLI
        run: python scripts/verify_merge_resolution.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.12.0
      - name: Build Rust kriging and C++ pseudoflow kernels
        shell: pwsh
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain failed' }
          python -m pip install maturin==1.7.8
          python scripts/build_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native kernel build failed' }
          "RAINYMINE_REQUIRE_NATIVE=1" >> $env:GITHUB_ENV
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (python scripts/release_version.py --check).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release version mismatch' }
          "RAINYMINE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Cache pinned local AI assets
        uses: actions/cache@v4
        with:
          path: ai
          key: rainy-local-ai-b11796-qwen3-1.7b-d2387ca2
      - name: Prepare local AI engine and GGUF
        run: python scripts/prepare_local_ai.py --model
      - name: Prepare optional CPU OpenGL renderer
        shell: pwsh
        run: ./scripts/prepare_mesa.ps1
      - name: Enable real local-model checks
        shell: pwsh
        run: |
          $model = (Resolve-Path 'ai/models/Qwen3-1.7B-Q4_K_M.gguf').Path
          "RAINYMINE_AI_SMOKE_MODEL=$model" >> $env:GITHUB_ENV
      - name: Geometry, file and scene tests
        run: python -m unittest discover -s tests -v
      - name: One million disk blocks create estimate undo export benchmark
        run: python scripts/benchmark_disk_workflow.py --side 100 --output windows-disk-workflow.json
      - name: Native pseudoflow million-block and kriging reference benchmark
        run: python scripts/benchmark_native.py --output windows-native-benchmark.json
      - name: Toolbar layout at 150 and 200 percent scaling
        shell: pwsh
        run: |
          foreach ($scale in @('1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python -m unittest tests.test_readable_ui.ReadableWorkspaceTests.test_all_captions_fit_and_last_command_can_be_scrolled_into_view -v
            if ($LASTEXITCODE -ne 0) { throw "Toolbar layout failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Desktop smoke test
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'main.py','--smoke','--screenshot','windows-smoke.png' -PassThru -NoNewWindow -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Desktop smoke test timed out' }
          Get-Content smoke-out.log,smoke-err.log
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed: $($p.ExitCode)" }
      - name: English desktop smoke test
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'main.py','--smoke','--language','en','--screenshot','windows-smoke-en.png' -PassThru -NoNewWindow -RedirectStandardOutput smoke-en-out.log -RedirectStandardError smoke-en-err.log
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'English desktop timed out' }
          Get-Content smoke-en-out.log,smoke-en-err.log
          if ($p.ExitCode -ne 0) { throw 'English desktop failed' }
      - name: Package and test Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Rainymine.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          & ./scripts/sign_windows.ps1 -Path '.\dist\Rainymine-${{ env.RAINYMINE_VERSION }}-Setup-x64.exe'
      - name: Verify silent install and installed executable
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'RainymineInstalled'
          $setup = Start-Process '.\dist\Rainymine-${{ env.RAINYMINE_VERSION }}-Setup-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest" -PassThru
          if (-not $setup.WaitForExit(60000)) { $setup.Kill(); throw 'Install timed out' }
          if ($setup.ExitCode -ne 0) { throw 'Install failed' }
          $userProject = Join-Path $env:RUNNER_TEMP 'Rainymine-upgrade-sentinel.rmine'
          Copy-Item examples/demo.rmine $userProject
          $projectHash = (Get-FileHash $userProject -Algorithm SHA256).Hash
          # Reinstall into the same directory to exercise the upgrade path.
          $again = Start-Process '.\dist\Rainymine-${{ env.RAINYMINE_VERSION }}-Setup-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest" -PassThru
          if (-not $again.WaitForExit(60000)) { $again.Kill(); throw 'Reinstall timed out' }
          if ($again.ExitCode -ne 0) { throw 'Reinstall failed' }
          if ((Get-FileHash $userProject -Algorithm SHA256).Hash -ne $projectHash) { throw 'Upgrade modified user project' }
          $app = Start-Process (Join-Path $dest 'Rainymine.exe') -ArgumentList '--smoke' -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'Installed app smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw 'Installed app failed' }
          $english = Start-Process (Join-Path $dest 'Rainymine.exe') -ArgumentList '--smoke','--language','en' -PassThru
          if (-not $english.WaitForExit(180000)) { $english.Kill(); throw 'Installed English app timed out' }
          if ($english.ExitCode -ne 0) { throw 'Installed English app failed' }
          $remove = Start-Process (Join-Path $dest 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $remove.WaitForExit(60000)) { $remove.Kill(); throw 'Uninstall timed out' }
          if ($remove.ExitCode -ne 0 -or (Test-Path (Join-Path $dest 'Rainymine.exe'))) { throw 'Uninstall failed' }
          if ((Get-FileHash $userProject -Algorithm SHA256).Hash -ne $projectHash) { throw 'Uninstall modified user project' }
      - uses: actions/upload-artifact@v4
        with:
          name: Rainymine-Windows-x64
          path: |
            dist/Rainymine-${{ env.RAINYMINE_VERSION }}-Windows-x64.zip
            dist/Rainymine-${{ env.RAINYMINE_VERSION }}-Setup-x64.exe
            windows-smoke.png
            windows-smoke-en.png
            windows-startup.png
            windows-disk-workflow.json
            windows-native-benchmark.json
          if-no-files-found: error
      - name: Upload full offline AI portable
        uses: actions/upload-artifact@v4
        with:
          name: Rainymine-AI-Offline-x64
          path: dist/Rainymine-${{ env.RAINYMINE_VERSION }}-AI-Offline-x64.zip
          compression-level: 0
          if-no-files-found: error
      - name: Assemble checked release kit
        run: python scripts/prepare_release.py --dist dist
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            *.log
            windows-smoke.png
            windows-smoke-en.png
            windows-startup.png
            dist/Rainymine/*.log
            windows-disk-workflow.json
            windows-native-benchmark.json
          if-no-files-found: ignore

      - name: Upload release documents and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Rainymine-Release-Kit
          path: |
            dist/Rainymine-${{ env.RAINYMINE_VERSION }}-Release-Kit.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/package-inventory.json
          if-no-files-found: error
  draft-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/rainymine-0.9'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rainymine-Windows-x64
          path: release-dist
      - uses: actions/download-artifact@v4
        with:
          name: Rainymine-AI-Offline-x64
          path: release-dist
      - uses: actions/download-artifact@v4
        with:
          name: Rainymine-Release-Kit
          path: release-dist
      - name: Verify checksums and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/create_draft_release.py --dist release-dist
